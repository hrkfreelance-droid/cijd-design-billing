name: Deploy Overhaul Preview

on:
  push:
    branches:
      - review/daishin-uiux-overhaul-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: review/daishin-uiux-overhaul-20260905

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed implementation files
        run: |
          npx eslint --rule 'react-hooks/set-state-in-effect: off' src/components/ui.tsx src/app/designer/projects/page.tsx src/lib/build-info.ts

      - name: Inspect current preview identity
        run: |
          echo "Current preview identity:"
          curl -fsS https://cijd-design-billing-preview.hrk-freelance.workers.dev/api/version || true
          echo

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy reversible preview
        run: node scripts/deploy-overhaul-preview.mjs

      - name: Verify live commit
        run: node scripts/verify-overhaul-preview.mjs
