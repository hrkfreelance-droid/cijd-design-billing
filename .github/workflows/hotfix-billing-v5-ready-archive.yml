name: Hotfix Billing V5 Ready and Archive

on:
  push:
    branches:
      - feature/billing-v5-accounting-integration
    paths:
      - "src/components/billing-v3/billing-board.tsx"
      - "src/components/billing-v3/project-modal.tsx"
      - "src/components/billing-v5/tax-invoice-page.tsx"
      - "src/lib/billing-v5/i18n.ts"
      - ".github/workflows/hotfix-billing-v5-ready-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cijd-billing-v5-hotfix
  cancel-in-progress: true

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://cijd-design-billing-v5-preview.hrk-freelance.workers.dev
      WORKER_NAME: cijd-design-billing-v5-preview
      DB_NAME: cijd-design-billing-v5-preview
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN_4: ${{ secrets.WORKERS_API_TOKEN }}
      TOKEN_5: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      TOKEN_6: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
      TOKEN_7: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      TOKEN_8: ${{ secrets.CF_WORKERS_TOKEN }}
      ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
      ACCOUNT_3: ${{ secrets.CLOUDFLARE_ACCOUNT }}

    steps:
      - name: Checkout exact V5 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/billing-v5-accounting-integration

      - name: Restore RH Pchum Ben 2026 to Ready to Bill
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/api/state" > /tmp/v5-state-before.json

          MATCHES="$(jq '[.data.projects[] | select(.name == "RH Pchum Ben 2026" and (.deletedAt == null))] | length' /tmp/v5-state-before.json)"
          if [ "$MATCHES" != "1" ]; then
            echo "::error::Expected exactly one active project named RH Pchum Ben 2026; found $MATCHES."
            exit 20
          fi

          PID="$(jq -r '.data.projects[] | select(.name == "RH Pchum Ben 2026" and (.deletedAt == null)) | .id' /tmp/v5-state-before.json)"
          BEFORE="$(jq -r --arg id "$PID" '.data.projects[] | select(.id == $id) | (.billingReadiness // "AUTO")' /tmp/v5-state-before.json)"

          BAD_STATUS="$(jq --arg pid "$PID" '
            [ .data.billingItems[]
              | select(.projectId == $pid and (.deletedAt == null))
              | select(.billingStatus == "INVOICED" or .billingStatus == "PAID")
            ] | length
          ' /tmp/v5-state-before.json)"

          ACTIVE_ALLOC="$(jq --arg pid "$PID" '
            [ .data.billingItems[]
              | select(.projectId == $pid and (.deletedAt == null))
              | .id
            ] as $ids
            | [ ((.data.billingAllocations // [])[])
                | select(.voidedAt == null)
                | select(.billingItemId as $itemId | ($ids | index($itemId)) != null)
              ] | length
          ' /tmp/v5-state-before.json)"

          echo "RH Pchum Ben 2026 before: readiness=$BEFORE active_allocations=$ACTIVE_ALLOC billed_lines=$BAD_STATUS"

          if [ "$ACTIVE_ALLOC" != "0" ] || [ "$BAD_STATUS" != "0" ]; then
            echo "::error::RH Pchum Ben 2026 has invoice/billing history. Refusing an automatic data rewrite."
            exit 21
          fi

          if [ "$BEFORE" != "READY" ]; then
            CODE="$(curl -sS -o /tmp/v5-repair-response.json -w "%{http_code}" \
              -X PATCH \
              -H "Content-Type: application/json" \
              --data '{"readiness":"READY"}' \
              "$BASE_URL/api/projects/$PID/readiness")"
            if [ "$CODE" != "200" ]; then
              cat /tmp/v5-repair-response.json
              echo "::error::Ready-to-Bill repair returned HTTP $CODE."
              exit 22
            fi
          fi

          curl -fsS "$BASE_URL/api/state" > /tmp/v5-state-after-repair.json
          AFTER="$(jq -r --arg id "$PID" '.data.projects[] | select(.id == $id) | (.billingReadiness // "AUTO")' /tmp/v5-state-after-repair.json)"
          if [ "$AFTER" != "READY" ]; then
            echo "::error::RH Pchum Ben 2026 did not end in READY; got $AFTER."
            exit 23
          fi
          echo "RH Pchum Ben 2026 repaired: READY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for CANDIDATE in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4" "$TOKEN_5" "$TOKEN_6" "$TOKEN_7" "$TOKEN_8"; do
            if [ -n "$CANDIDATE" ]; then
              TOKEN="$CANDIDATE"
              break
            fi
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token is configured in repository secrets."
            exit 30
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          ACCOUNT=""
          for CANDIDATE in "$ACCOUNT_1" "$ACCOUNT_2" "$ACCOUNT_3"; do
            if [ -n "$CANDIDATE" ]; then
              ACCOUNT="$CANDIDATE"
              break
            fi
          done
          if [ -z "$ACCOUNT" ]; then
            ACCOUNTS_JSON="$(curl -fsS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/accounts)"
            ACCOUNT="$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.result[]?.id' | head -n 1)"
          fi
          if [ -z "$ACCOUNT" ] || [ "$ACCOUNT" = "null" ]; then
            echo "::error::Cloudflare account ID could not be resolved."
            exit 31
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Confirm existing V5 Worker and D1
        shell: bash
        run: |
          set -euo pipefail
          SCRIPTS="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          printf '%s' "$SCRIPTS" | jq -e --arg N "$WORKER_NAME" '.result[]? | select(.id == $N)' >/dev/null || {
            echo "::error::Existing Worker $WORKER_NAME was not found; refusing to create one."
            exit 32
          }

          DB_ID="$(npx wrangler d1 list --json | jq -r --arg N "$DB_NAME" '.[] | select(.name == $N) | .uuid' | head -n 1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::Existing D1 $DB_NAME was not found; refusing to create one."
            exit 33
          fi
          echo "V5_DB_ID=$DB_ID" >> "$GITHUB_ENV"

          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            > /tmp/v5-worker-settings-before.json
          jq -S '[.result.bindings[]? | {name,type}]' /tmp/v5-worker-settings-before.json > /tmp/v5-bindings-before.json

      - name: Build exact V5 code
        shell: bash
        run: |
          set -euo pipefail
          sed "s/00000000-0000-0000-0000-000000000000/$V5_DB_ID/" wrangler.v5.jsonc > wrangler.v5.deploy.jsonc
          CIJD_WRANGLER_CONFIG=wrangler.v5.deploy.jsonc npx vinext build
          BUILT="$(node -e 'console.log(require("./dist/server/wrangler.json").name)')"
          [ "$BUILT" = "$WORKER_NAME" ] || {
            echo "::error::Built Worker is $BUILT, expected $WORKER_NAME."
            exit 34
          }

      - name: Deploy V5 hotfix only
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars

      - name: Verify live V5 and bindings
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 18); do
            DESIGN="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/office-v5" || true)"
            ACCOUNTING="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/office-v5/accounting" || true)"
            ARCHIVE="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/office-v5/archive" || true)"
            STATE="$(curl -sS -o /tmp/v5-final-state.json -w "%{http_code}" "$BASE_URL/api/state" || true)"
            if [ "$DESIGN" = "200" ] && [ "$ACCOUNTING" = "200" ] && [ "$ARCHIVE" = "200" ] && [ "$STATE" = "200" ]; then
              break
            fi
            echo "attempt=$ATTEMPT design=$DESIGN accounting=$ACCOUNTING archive=$ARCHIVE state=$STATE"
            sleep 10
          done
          [ "$DESIGN" = "200" ] && [ "$ACCOUNTING" = "200" ] && [ "$ARCHIVE" = "200" ] && [ "$STATE" = "200" ] || {
            echo "::error::Live V5 verification failed."
            exit 35
          }

          PID="$(jq -r '.data.projects[] | select(.name == "RH Pchum Ben 2026" and (.deletedAt == null)) | .id' /tmp/v5-final-state.json)"
          FINAL_READY="$(jq -r --arg id "$PID" '.data.projects[] | select(.id == $id) | (.billingReadiness // "AUTO")' /tmp/v5-final-state.json)"
          [ "$FINAL_READY" = "READY" ] || {
            echo "::error::RH Pchum Ben 2026 is not READY after deploy: $FINAL_READY."
            exit 36
          }

          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            > /tmp/v5-worker-settings-after.json
          jq -S '[.result.bindings[]? | {name,type}]' /tmp/v5-worker-settings-after.json > /tmp/v5-bindings-after.json
          diff -u /tmp/v5-bindings-before.json /tmp/v5-bindings-after.json

          echo "V5 hotfix verified. RH Pchum Ben 2026 = READY."
