name: Deploy Billing V3 Preview

on:
  push:
    branches:
      - feature/billing-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cijd-billing-v3-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact V3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/billing-v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build vinext
        run: npm run build:vinext

      - name: Verify Cloudflare credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy existing preview Worker
        run: npm run deploy:vinext

      - name: Verify V3 and V2 routes
        run: |
          BASE="https://cijd-design-billing-preview.hrk-freelance.workers.dev"
          for PATHNAME in /office-v3 /office-v3/archive /office-v2; do
            CODE="$(curl -sS -o /tmp/page.html -w "%{http_code}" "$BASE$PATHNAME")"
            echo "$PATHNAME -> $CODE"
            test "$CODE" = "200"
          done
          STATE_CODE="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/api/state")"
          echo "/api/state -> $STATE_CODE"
          test "$STATE_CODE" = "200"
