name: Verify Billing V3 Preview

on:
  push:
    branches:
      - feature/billing-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cijd-billing-v3-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact V3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/billing-v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build vinext
        run: npm run build:vinext

      - name: Deploy with Wrangler when CI credentials are configured
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy:vinext

      - name: Note connected-source deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Wrangler CI credentials are not configured; Cloudflare connected-source deployment handles the preview."

      - name: Verify live V3 and V2 routes
        run: |
          BASE="https://cijd-design-billing-preview.hrk-freelance.workers.dev"
          for ATTEMPT in $(seq 1 18); do
            V3="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/office-v3" || true)"
            ARCHIVE="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/office-v3/archive" || true)"
            V2="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/office-v2" || true)"
            STATE="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/api/state" || true)"
            echo "attempt=$ATTEMPT v3=$V3 archive=$ARCHIVE v2=$V2 state=$STATE"
            if [ "$V3" = "200" ] && [ "$ARCHIVE" = "200" ] && [ "$V2" = "200" ] && [ "$STATE" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
